# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/zerops-yml-json-schema.json

zerops:
  # ---------------- Frontend: native static service ----------------
  - setup: app
    build:
      base: nodejs@22
      buildCommands:
        - cd apps/web && npm install && npm run build
      deployFiles: ./apps/web/dist/~
      envVariables:
        VITE_API_URL: https://api-2e34-3000.prg1.zerops.app
    run:
      base: static
      routing:
        redirects:
          - from: /*
            to: /index.html
            preservePath: false

  # ---------------- API (public) ----------------
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - cd apps/api && npm install && npm run build
      deployFiles:
        - apps/api/dist
        - apps/api/package.json
        - apps/api/node_modules
      cache: apps/api/node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: node apps/api/dist/index.js
      envVariables:
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:${db_port}/${db_dbName}
        REDIS_HOST: cache
        REDIS_PORT: "6379"

  # ---------------- Ingestor (private, scheduled) ----------------
  - setup: ingestor
    build:
      base: nodejs@22
      buildCommands:
        - cd apps/ingestor && npm install && npm run build
      deployFiles:
        - apps/ingestor/dist
        - apps/ingestor/package.json
        - apps/ingestor/node_modules
      cache: apps/ingestor/node_modules
    run:
      base: nodejs@22
      start: node apps/ingestor/dist/index.js
      envVariables:
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:${db_port}/${db_dbName}
        REDIS_HOST: cache
        REDIS_PORT: "6379"